<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Finder</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div class="container">
    <h1>Route Finder</h1>
    <div class="controls">
        <div class="form-group">
            <label for="distance">Distance (km)</label>
            <input type="number" id="distance" value="5" min="1" max="50" step="0.5">
        </div>
        <div class="form-group">
            <label for="profile">Activity</label>
            <select id="profile">
                <option value="foot-walking">Walking/Running</option>
                <option value="foot-hiking">Hiking</option>
                <option value="cycling-regular">Cycling (Regular)</option>
                <option value="cycling-road">Cycling (Road)</option>
                <option value="cycling-mountain">Cycling (Mountain)</option>
                <option value="cycling-electric">Cycling (Electric)</option>
                <option value="driving-car">Driving (Car)</option>
            </select>
        </div>

        <button id="generateBtn" onclick="generateRoute()">Generate Route</button>
        <button id="useLocationBtn" onclick="useMyLocation()">Use My Location</button>
        <button id="downloadBtn" onclick="downloadRoute()" disabled>Download Route</button>

        <div class="form-group">
            <label for="format">Download Format</label>
            <select id="format">
                <option value="gpx">GPX (for GPS apps/watches)</option>
                <option value="geojson">GeoJSON (for maps)</option>
                <option value="json">JSON (raw)</option>
            </select>
        </div>

    </div>
    <div id="map"></div>
    <div id="routeInfo"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
