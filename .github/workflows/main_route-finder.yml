# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - route-finder

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore RouteFinder.sln

      - name: Build with dotnet
        run: dotnet build RouteFinder.sln --configuration Release --no-restore

      - name: Test with dotnet
        run: dotnet test RouteFinder.sln --configuration Release --no-build

      - name: dotnet publish
        if: github.event_name != 'pull_request'
        run: dotnet publish RouteFinder/RouteFinder.csproj -c Release -o "${{ github.workspace }}/publish" --no-build

      - name: Upload artifact for deployment job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish

  deploy:
    runs-on: windows-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_45BF8A05FE3C49CC8663CD79E43824A9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_12901ACA593242D191878E0583422C19 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6E0A5215BA2F44248B58070E89C6BED3 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'route-finder'
          slot-name: 'Production'
          package: .
          