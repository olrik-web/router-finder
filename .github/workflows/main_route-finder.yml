name: Build, test and deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test API
        run: dotnet test --configuration Release --no-build

      - name: Test frontend
        run: npm test

      - name: Publish
        if: github.event_name != 'pull_request'
        run: dotnet publish RouteFinder/RouteFinder.csproj --configuration Release --no-build --output publish

      - name: Upload artifact for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: route-finder
          path: publish

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'
    permissions:
      id-token: write # Needed to request the OIDC token for azure/login
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: route-finder

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_45BF8A05FE3C49CC8663CD79E43824A9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_12901ACA593242D191878E0583422C19 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6E0A5215BA2F44248B58070E89C6BED3 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: route-finder
          slot-name: Production
          package: .
